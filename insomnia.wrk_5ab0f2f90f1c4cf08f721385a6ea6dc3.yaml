                : "";

                insomnia.test("Content-Type is CSV", () => {
                  insomnia.expect(contentType.toLowerCase()).to.match(/^text\/csv/);
                });

                const text = insomnia.response.text().trim();

                const lines = text.split(/\r?\n/);

                const headers = lines[0].replace(/"/g, "").split(",");

