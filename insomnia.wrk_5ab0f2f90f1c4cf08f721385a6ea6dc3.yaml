  - name: 30 Caching
    meta:
      id: fld_59d50fef4e7b49d69293f3e839f20d4a
      created: 1790087621210
      modified: 1790087621210
      sortKey: -1788297476929
      description: Manual gateway cache warming only. Run after the new release is healthy and ITS confirms the gateway cache reset.
    children:
      - url: "{{base_url}}/pip"
        name: Warm GET /pip - all country and year
        meta:
          id: req_b5d107e4c8394a62bf1e7530d8962ca4
          created: 1790087621210
          modified: 1790087621210
          isPrivate: false
          description: Manual cache warmer. Iteration data supplies canonical poverty-line, PPP year, and format values. This is expensive and must not run as part of Smoke or Full.
          sortKey: -1788297476929.6
        method: GET
        parameters:
          - name: country
            value: all
            disabled: false
          - name: year
            value: all
            disabled: false
          - name: povline
            value: "{{povline}}"
            disabled: false
          - name: ppp_version
            value: "{{ppp_version}}"
            disabled: false
          - name: format
            value: "{{format}}"
            disabled: false
        scripts:
          afterResponse: >
            const format = insomnia.iterationData.get("format");
            const povline = insomnia.iterationData.get("povline");
            const pppVersion = insomnia.iterationData.get("ppp_version");
            const resolvedVersion = insomnia.iterationData.get("resolved_version");
            const releaseVersion = insomnia.iterationData.get("release_version");
            const cacheHeader = insomnia.response.headers.find(header => header.key.toLowerCase() === "x-pipapi-cache");
            const contentType = (insomnia.response.headers.find(header => header.key.toLowerCase() === "content-type") || {}).value || "";
            const text = insomnia.response.text().trim();

            insomnia.test("Status is 200", () => {
              insomnia.expect(insomnia.response.code).to.equal(200);
            });

            insomnia.test("Response body is not empty", () => {
              insomnia.expect(text).not.to.be.empty;
            });

            if (format === "json") {
              insomnia.test("JSON cache-warm response is valid and has data", () => {
                insomnia.expect(contentType.toLowerCase()).to.match(/^application\/json/);
                const body = insomnia.response.json();
                insomnia.expect(body && body.error).to.equal(undefined);
                if (Array.isArray(body)) {
                  insomnia.expect(body).not.to.be.empty;
                } else {
                  insomnia.expect(body).to.be.an("object");
                  insomnia.expect(Object.keys(body)).not.to.be.empty;
                  insomnia.expect(body.ok).not.to.equal(false);
                }
              });
            } else {
              insomnia.test("CSV cache-warm response is valid and has data", () => {
                const lines = text.split(/\r?\n/);
                const headers = lines[0].replace(/"/g, "").split(",");
                insomnia.expect(format).to.equal("csv");
                insomnia.expect(contentType.toLowerCase()).to.match(/^text\/csv/);
                insomnia.expect(lines.length).to.be.greaterThan(1);
                insomnia.expect(headers).to.include.members(["country_code", "reporting_year", "poverty_line", "headcount", "poverty_gap", "mean"]);
              });
            }

            console.log("PIP_CACHE_WARM_RESULT " + JSON.stringify({ timestampUtc: new Date().toISOString(), povline, pppVersion, format, releaseVersion, resolvedVersion, responseTime: insomnia.response.responseTime, status: insomnia.response.code, responseSize: text.length, pipapiCache: cacheHeader ? cacheHeader.value : null, gatewayCacheSignal: null }));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: false
            store: false
          rebuildPath: true
