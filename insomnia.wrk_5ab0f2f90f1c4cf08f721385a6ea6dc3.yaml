        meta:
          id: req_74d7d5449da54e43a1713d2a29f5c15d
          created: 1790087621210
          modified: 1790087621210
          isPrivate: false
          description: Manual performance request. Lightweight path and network baseline. Run only through the performance runner or a deliberately selected Collection Runner scope.
          sortKey: -1788297476930.6
        method: GET
        scripts:
          afterResponse: >
            insomnia.test("Status is 200", () => {
              insomnia.expect(insomnia.response.code).to.equal(200);
            });

            const contentType = (insomnia.response.headers.find(header => header.key.toLowerCase() === "content-type") || {}).value || "";
            const cacheHeader = insomnia.response.headers.find(header => header.key.toLowerCase() === "x-pipapi-cache");
            const text = insomnia.response.text().trim();
            insomnia.test("Response is non-empty JSON", () => {
              insomnia.expect(contentType.toLowerCase()).to.match(/^application\/json/);
              insomnia.expect(text).not.to.be.empty;
              const body = insomnia.response.json();
              insomnia.expect(body && body.error).to.equal(undefined);
              if (body && !Array.isArray(body) && typeof body === "object") {
                insomnia.expect(body.ok).not.to.equal(false);
              }
            });

            console.log("PIP_PERFORMANCE_RESULT " + JSON.stringify({ timestampUtc: new Date().toISOString(), endpoint: "health-check", format: "json", responseTime: insomnia.response.responseTime, status: insomnia.response.code, responseSize: text.length, pipapiCache: cacheHeader ? cacheHeader.value : null, gatewayCacheSignal: null }));
